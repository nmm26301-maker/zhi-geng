name: Build Zhigeng Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android-smoke.py', 'scripts/fcc-protocol-fixture.py', 'scripts/android-reader-smoke.py', 'scripts/prepare-reader-font.py', 'scripts/make-reader-fixtures.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check download and AI navigation policies
        run: |
          mkdir -p /tmp/zhigeng-tests
          javac -d /tmp/zhigeng-tests android/app/src/main/java/cn/zhigeng/app/DownloadPolicy.java android/tests/DownloadPolicyTest.java android/app/src/main/java/cn/zhigeng/app/DuckAiPolicy.java android/tests/DuckAiPolicyTest.java
          java -cp /tmp/zhigeng-tests cn.zhigeng.app.DownloadPolicyTest
          java -cp /tmp/zhigeng-tests cn.zhigeng.app.DuckAiPolicyTest
      - uses: actions/cache@v4
        id: reader-font
        with:
          path: android/app/src/main/assets/fonts/zhigeng-serif.woff2
          key: reader-font-${{ hashFiles('scripts/prepare-reader-font.py') }}
      - name: Prepare offline Chinese reading font
        if: steps.reader-font.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install fonttools==4.59.0 brotli==1.1.0
          python3 scripts/prepare-reader-font.py
      - name: Prepare debug reading documents
        run: python3 scripts/make-reader-fixtures.py
      - name: Build native application
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon
      - name: Package unsigned APK and signing verifier
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Zhigeng-v0.6.6-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Zhigeng-debug-test.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-output/Zhigeng-v0.6.6-unsigned.apk > apk-output/package-info.txt
          test "$(unzip -p apk-output/Zhigeng-v0.6.6-unsigned.apk classes.dex | wc -c)" -gt 10000
          ! unzip -l apk-output/Zhigeng-v0.6.6-unsigned.apk | grep -q 'lib/.*\.so'
          ! unzip -p apk-output/Zhigeng-v0.6.6-unsigned.apk classes.dex | grep -a -q 'fixture-token-not-a-secret'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources apk-output/Zhigeng-v0.6.6-unsigned.apk | grep -q 'fcc_test_ca'
      - uses: actions/upload-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.6
          path: apk-output/
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.6
          path: apk-output
      - name: Start local FCC protocol fixture
        run: |
          python3 scripts/fcc-protocol-fixture.py > /tmp/fcc-fixture.log 2>&1 &
          echo $! > /tmp/fcc-fixture.pid
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhigeng-v0.6.6-emulator-check
          path: emulator-check/
          retention-days: 30

  reader:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.6
          path: apk-output
      - name: Install screenshot verifier
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: python3 scripts/android-reader-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhigeng-v0.6.6-reader-check
          path: emulator-check/
          retention-days: 30
