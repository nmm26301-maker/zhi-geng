name: Build Zhigeng Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native application
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Package unsigned APK and signing verifier
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Zhigeng-v0.5.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-output/Zhigeng-v0.5.0-unsigned.apk > apk-output/package-info.txt
          test "$(unzip -p apk-output/Zhigeng-v0.5.0-unsigned.apk classes.dex | wc -c)" -gt 10000
          ! unzip -l apk-output/Zhigeng-v0.5.0-unsigned.apk | grep -q 'lib/.*\.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Zhigeng-native-android-v0.5.0
          path: apk-output/
          retention-days: 30
