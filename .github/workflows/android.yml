name: Build Zhigeng Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android-smoke.py', 'scripts/fcc-protocol-fixture.py', 'scripts/android-reader-smoke.py', 'scripts/prepare-reader-font.py', 'scripts/make-reader-fixtures.py', 'scripts/prepare-android-posters.mjs', 'scripts/build-static-site.mjs', 'data/domestic.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check download and AI navigation policies
        run: |
          mkdir -p /tmp/zhigeng-tests
          javac -d /tmp/zhigeng-tests android/app/src/main/java/cn/zhigeng/app/DownloadPolicy.java android/tests/DownloadPolicyTest.java android/app/src/main/java/cn/zhigeng/app/DuckAiPolicy.java android/tests/DuckAiPolicyTest.java
          java -cp /tmp/zhigeng-tests cn.zhigeng.app.DownloadPolicyTest
          java -cp /tmp/zhigeng-tests cn.zhigeng.app.DuckAiPolicyTest
      - uses: actions/cache@v4
        id: reader-font
        with:
          path: android/app/src/main/assets/fonts/zhigeng-serif.woff2
          key: reader-font-${{ hashFiles('scripts/prepare-reader-font.py') }}
      - name: Prepare offline Chinese reading font
        if: steps.reader-font.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install fonttools==4.59.0 brotli==1.1.0
          python3 scripts/prepare-reader-font.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle verified offline posters
        run: node scripts/prepare-android-posters.mjs
      - name: Prepare debug reading documents
        run: python3 scripts/make-reader-fixtures.py
      - name: Build native application
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon
      - name: Package unsigned APK and signing verifier
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Zhigeng-v0.6.7-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Zhigeng-debug-test.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-output/Zhigeng-v0.6.7-unsigned.apk > apk-output/package-info.txt
          test "$(unzip -p apk-output/Zhigeng-v0.6.7-unsigned.apk classes.dex | wc -c)" -gt 10000
          ! unzip -l apk-output/Zhigeng-v0.6.7-unsigned.apk | grep -q 'lib/.*\.so'
          ! unzip -p apk-output/Zhigeng-v0.6.7-unsigned.apk classes.dex | grep -a -q 'fixture-token-not-a-secret'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources apk-output/Zhigeng-v0.6.7-unsigned.apk | grep -q 'fcc_test_ca'
      - name: Build standalone preview release
        working-directory: android
        run: gradle :app:assembleRelease -PzhigengPreview --no-daemon
      - name: Sign and verify installable preview APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          source_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/zhigeng-preview-aligned.apk"
          preview_apk="apk-output/Zhigeng-v0.6.7-preview.apk"
          test -s "$HOME/.android/debug.keystore"
          "$tools/zipalign" -f -p 4 "$source_apk" "$aligned_apk"
          "$tools/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$preview_apk" "$aligned_apk"
          "$tools/apksigner" verify --verbose --print-certs "$preview_apk" > apk-output/preview-signature.txt
          "$tools/aapt" dump badging "$preview_apk" > apk-output/preview-package-info.txt
          grep -q "^package: name='cn.zhigeng.app.preview'" apk-output/preview-package-info.txt
          grep -q "application-label:'知更预览'" apk-output/preview-package-info.txt
          sha256sum "$preview_apk" > apk-output/preview-sha256.txt
          echo "Preview APK signed and verified. Preview builds may use different debug certificates between runs." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.7
          path: apk-output/
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.7
          path: apk-output
      - name: Start local FCC protocol fixture
        run: |
          python3 scripts/fcc-protocol-fixture.py > /tmp/fcc-fixture.log 2>&1 &
          echo $! > /tmp/fcc-fixture.pid
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1 -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: |
            python3 scripts/android-smoke.py
            adb install -r apk-output/Zhigeng-v0.6.7-preview.apk
            adb shell am start -W -n cn.zhigeng.app.preview/cn.zhigeng.app.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/zhigeng-preview.xml
            adb shell cat /sdcard/zhigeng-preview.xml | grep -q '国内精选'
            adb logcat -d -s AndroidRuntime:E > emulator-check/preview-runtime-errors.txt
            ! grep -q 'FATAL EXCEPTION' emulator-check/preview-runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhigeng-v0.6.7-emulator-check
          path: emulator-check/
          retention-days: 30

  reader:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.7
          path: apk-output
      - name: Install screenshot verifier
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1 -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: python3 scripts/android-reader-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhigeng-v0.6.7-reader-check
          path: emulator-check/
          retention-days: 30

  publish_preview:
    needs: [build, emulator, reader]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.7
          path: apk-output
      - name: Publish independently installable preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: preview-v0.6.7-run-${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s apk-output/Zhigeng-v0.6.7-preview.apk
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo "The run-specific preview is already published; do not replace its signing identity."
            exit 0
          fi
          gh release create "$PREVIEW_TAG" apk-output/Zhigeng-v0.6.7-preview.apk apk-output/preview-sha256.txt \
            --target "$GITHUB_SHA" \
            --title "知更 Android 0.6.7 预览 · 构建 $GITHUB_RUN_NUMBER" \
            --prerelease \
            --notes "这是通过构建、阅读器及 Android 模拟器检查后发布的独立预览版。包名 cn.zhigeng.app.preview，不覆盖正式知更。使用构建时生成的测试签名，不可用于正式版覆盖升级；不同预览构建的签名可能不同。正式版请沿用 releases/ 目录已发布的原签名安装包。"
          echo "Published installable preview APK to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
