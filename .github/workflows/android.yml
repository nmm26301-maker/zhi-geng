name: Build Zhigeng Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check download validation
        run: |
          mkdir -p /tmp/zhigeng-tests
          javac -d /tmp/zhigeng-tests android/app/src/main/java/cn/zhigeng/app/DownloadPolicy.java android/tests/DownloadPolicyTest.java
          java -cp /tmp/zhigeng-tests cn.zhigeng.app.DownloadPolicyTest
      - name: Build native application
        working-directory: android
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon
      - name: Package unsigned APK and signing verifier
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Zhigeng-v0.6.0-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Zhigeng-debug-test.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-output/Zhigeng-v0.6.0-unsigned.apk > apk-output/package-info.txt
          test "$(unzip -p apk-output/Zhigeng-v0.6.0-unsigned.apk classes.dex | wc -c)" -gt 10000
          ! unzip -l apk-output/Zhigeng-v0.6.0-unsigned.apk | grep -q 'lib/.*\.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.0
          path: apk-output/
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zhigeng-native-android-v0.6.0
          path: apk-output
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhigeng-v0.6.0-emulator-check
          path: emulator-check/
          retention-days: 30
