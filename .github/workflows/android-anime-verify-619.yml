name: Verify compiled 0.6.19 provider and tracker UI
on:
  push:
    branches: [codex/anime-619]
    paths: ['.github/workflows/android-anime-verify-619.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore exact compiled APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12783772325/zip -o build619.zip
          unzip -q build619.zip 'apk-output/*'
      - name: Prepare original HTTPS and video fixtures
        run: |
          python3 -m pip install pillow imageio-ffmpeg
          export ZHIGENG_TEST_FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python3 scripts/prepare-video-fixture.py
          python3 scripts/anime-extension-fixture.py > /tmp/extension-fixture.log 2>&1 &
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -memory 2048
          script: |
            adb install apk-output/Zhigeng-debug-test.apk
            python3 scripts/android-extension-smoke.py
      - name: Preserve extension and tracker runtime evidence
        if: always()
        run: |
          mkdir -p releases/checks-0.6.19
          cp -R extension-check/. releases/checks-0.6.19/ || true
          cp /tmp/extension-fixture.log releases/checks-0.6.19/fixture.log || true
          rm -f releases/checks-0.6.19/fixture.pid
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/checks-0.6.19
          git diff --cached --quiet || git commit -m 'test: preserve original provider and tracker Android evidence [skip ci]'
          git stash --include-untracked
          git pull --rebase origin codex/anime-619
          git push origin HEAD:codex/anime-619
