name: Verify phone book copies and original signed upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-phone-download.yml', 'scripts/android-local-download-smoke.py']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled builds from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12352256395/zip -o build612.zip
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12348660112/zip -o build611.zip
          echo 'bea748b439782fd7b96f1a14309a1891dfd2e7d541f40df6f00b7cc378b0b130  build612.zip' | sha256sum --check
          echo '99ff8f5fe9cbc921921b7cf4dad93d85c865032b375d132eff7cdb35f3e30b7f  build611.zip' | sha256sum --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct exact signed releases without a private key
        run: |
          mkdir -p "$RUNNER_TEMP/zhigeng-signatures" backups/Zhigeng-0.6.12 apk-output
          unzip -p build611.zip apk-output/Zhigeng-v0.6.11-unsigned.apk > "$RUNNER_TEMP/zhigeng-signatures/Zhigeng-v0.6.11.apk"
          unzip -p build612.zip apk-output/Zhigeng-v0.6.12-unsigned.apk > "$RUNNER_TEMP/zhigeng-signatures/Zhigeng-v0.6.12.apk"
          (cd "$RUNNER_TEMP/zhigeng-signatures" && git apply --binary -p2 "$GITHUB_WORKSPACE/releases/signatures/v0.6.11.patch")
          (cd "$RUNNER_TEMP/zhigeng-signatures" && git apply --binary -p2 "$GITHUB_WORKSPACE/releases/signatures/v0.6.12.patch")
          cp "$RUNNER_TEMP/zhigeng-signatures/Zhigeng-v0.6.11.apk" previous.apk
          cp "$RUNNER_TEMP/zhigeng-signatures/Zhigeng-v0.6.12.apk" backups/Zhigeng-0.6.12/Zhigeng-v0.6.12.apk
          echo '8b461ac4d26cad440e07ad95b6df4b8d42c82e887d6c0e8f28618a3b7653a1f9  previous.apk' | sha256sum --check
          echo '88f557a3ae66623ceef686b0fcba177ada15061a9a806a665e151aac6e6e6873  backups/Zhigeng-0.6.12/Zhigeng-v0.6.12.apk' | sha256sum --check
          unzip -p build612.zip apk-output/apksigner.jar > apk-output/apksigner.jar
          unzip -p build612.zip apk-output/Zhigeng-debug-test.apk > apk-output/Zhigeng-debug-test.apk
          java -jar apk-output/apksigner.jar verify --min-sdk-version 26 --verbose --print-certs backups/Zhigeng-0.6.12/Zhigeng-v0.6.12.apk
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify update and independently visible phone files on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: |
            python3 scripts/android-upgrade-phone-612.py
            adb uninstall cn.zhigeng.app
            adb install -r apk-output/Zhigeng-debug-test.apk
            python3 scripts/android-local-download-smoke.py
      - name: Preserve real phone-copy and upgrade reports
        if: always()
        run: |
          mkdir -p releases/checks-0.6.12
          if test -d backups/Zhigeng-0.6.12/checks; then cp -R backups/Zhigeng-0.6.12/checks releases/checks-0.6.12/upgrade; fi
          if test -d phone-download-check; then cp -R phone-download-check releases/checks-0.6.12/phone; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/checks-0.6.12
          git diff --cached --quiet || git commit -m 'test: preserve Android 13 local book copy and covering-upgrade results [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
