name: Verify 0.6.13 older Android compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-reading-compat-613.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse the exact compiled 0.6.13 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12518236698/zip -o build613.zip
          echo 'b388b6f317a6b4b834505e98bdb30bbdbb175c45a2a50617e2993f399431b311  build613.zip' | sha256sum --check
          mkdir -p apk-output android/app/src/debug/assets
          unzip -p build613.zip apk-output/Zhigeng-debug-test.apk > apk-output/Zhigeng-debug-test.apk
          unzip -p apk-output/Zhigeng-debug-test.apk assets/reader-fixture.epub > android/app/src/debug/assets/reader-fixture.epub
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Start original local BookOrbit protocol fixture
        if: matrix.api != 29
        run: python3 scripts/bookorbit-protocol-fixture.py > /tmp/bookorbit-fixture.log 2>&1 &
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android 8 native pages and HTTPS storage flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: |
            adb install -r apk-output/Zhigeng-debug-test.apk
            python3 scripts/android-compat-613.py
      - name: Preserve compatibility evidence
        if: always()
        env:
          ANDROID_API: ${{ matrix.api }}
        run: |
          target="releases/checks-0.6.13/compat-api$ANDROID_API"
          mkdir -p "$target"
          for directory in reading-tools-check browser-check phone-download-check; do
            if test -d "$directory"; then mkdir -p "$target/$directory"; cp -R "$directory/." "$target/$directory/"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --quiet || git commit -m "test: preserve Android $ANDROID_API compatibility evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
