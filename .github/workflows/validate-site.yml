name: Validate Zhigeng site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and book UI references
        run: |
          node --check assets/app.js
          node --check assets/book-bridge.js
          node --check assets/book-library.js
          node --check assets/books-catalog.js
          node --check scripts/refresh-books.mjs
          node scripts/check-book-bridge.mjs
          node scripts/check-book-library.mjs
      - name: Smoke test main book interactions
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node scripts/test-book-ui.mjs
          node scripts/test-book-resilience.mjs
