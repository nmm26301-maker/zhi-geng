name: Validate Zhigeng site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and book UI references
        run: |
          node --check assets/app.js
          node --check assets/book-bridge.js
          node scripts/check-book-bridge.mjs
