name: Validate Zhigeng site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and book UI references
        run: |
          node --check server/gateway.mjs
          node --check assets/transport.js
          node --check assets/zlib.js
          node --check assets/app.js
          node --check assets/book-bridge.js
          node --check assets/book-library.js
          node --check assets/books-catalog.js
          node --check assets/book-search.js
          node --check scripts/refresh-books.mjs
          node scripts/check-book-bridge.mjs
          node scripts/check-book-library.mjs
      - name: Smoke test main book interactions
        run: |
          npm ci
          npm test
          node scripts/test-book-ui.mjs
          node scripts/test-book-resilience.mjs
          node scripts/test-real-book-search.mjs
      - name: Informational live-provider status
        run: node scripts/probe-book-apis.mjs

