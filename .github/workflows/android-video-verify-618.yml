name: Verify 0.6.18 decoded video, offline files and original signed upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-video-verify-618.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact compiled APKs and original certificate signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/zhigeng618signed" apk-output
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12669088495/zip -o build617.zip
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nmm26301-maker/zhi-geng/actions/artifacts/12703079241/zip -o build618.zip
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          for version in ('617','618'):
              name='0.6.'+version[-2:]
              manifest=json.loads(pathlib.Path('releases/Zhigeng-v'+name+'.json').read_text())
              with zipfile.ZipFile('build'+version+'.zip') as z:
                  raw=z.read('apk-output/Zhigeng-v'+name+'-unsigned.apk')
                  assert hashlib.sha256(raw).hexdigest()==manifest['unsignedApkSha256']
                  (pathlib.Path(os.environ['RUNNER_TEMP'])/'zhigeng618signed'/('Zhigeng-v'+name+'.apk')).write_bytes(raw)
                  if version=='618':
                      pathlib.Path('apk-output/apksigner.jar').write_bytes(z.read('apk-output/apksigner.jar'))
                      pathlib.Path('apk-output/Zhigeng-debug-test.apk').write_bytes(z.read('apk-output/Zhigeng-debug-test.apk'))
          PY
          (cd "$RUNNER_TEMP/zhigeng618signed" && git apply --binary -p2 "$GITHUB_WORKSPACE/releases/signatures/v0.6.17.patch")
          (cd "$RUNNER_TEMP/zhigeng618signed" && git apply --binary -p2 "$GITHUB_WORKSPACE/releases/signatures/v0.6.18.patch")
          cp "$RUNNER_TEMP/zhigeng618signed/Zhigeng-v0.6.17.apk" previous.apk
          cp "$RUNNER_TEMP/zhigeng618signed/Zhigeng-v0.6.18.apk" Zhigeng-v0.6.18.apk
          python3 - <<'PY'
          import hashlib,json,pathlib
          for version,file in [('0.6.17','previous.apk'),('0.6.18','Zhigeng-v0.6.18.apk')]:
              manifest=json.loads(pathlib.Path('releases/Zhigeng-v'+version+'.json').read_text())
              assert hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()==manifest['sha256']
          PY
          java -jar apk-output/apksigner.jar verify --min-sdk-version 26 --verbose --print-certs Zhigeng-v0.6.18.apk
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Generate original MP4 and HLS fixture and start HTTPS origin
        timeout-minutes: 3
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz -o "$RUNNER_TEMP/zhigeng-test-ffmpeg.gz"
          python3 - <<'PYTOOLS'
          import gzip,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);raw=(root/'zhigeng-test-ffmpeg.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa'
          target=root/'zhigeng-test-ffmpeg';target.write_bytes(gzip.decompress(raw));target.chmod(0o700)
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99'
          PYTOOLS
          # GPL-3.0 test-only tool from the pinned upstream release; never bundled in APK.
          ZHIGENG_TEST_FFMPEG="$RUNNER_TEMP/zhigeng-test-ffmpeg" python3 scripts/prepare-video-fixture.py
          python3 scripts/anime-video-fixture.py > /tmp/video-fixture.log 2>&1 &
      - name: Install screenshot pixel verifier
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Check verification scripts and retained baseline before starting emulator
        run: |
          python3 -m py_compile scripts/android-video-smoke.py scripts/android-upgrade-phone-618.py scripts/android-english-smoke.py
          python3 - <<'PYBASE'
          import json,pathlib,xml.etree.ElementTree as E
          baseline=json.loads(pathlib.Path('releases/checks-0.6.18/baseline-video-40437092864.json').read_text())
          assert baseline['versionCode']==618 and len(baseline['cases'])==5
          E.parse('releases/checks-0.6.18/video-check/02-resumed-and-completed.xml')
          PYBASE
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -memory 2048
          script: |
            adb install -r apk-output/Zhigeng-debug-test.apk
            python3 scripts/android-video-smoke.py --remaining
            python3 scripts/android-upgrade-phone-618.py
            python3 scripts/android-english-smoke.py
      - name: Preserve exact runtime evidence
        if: always()
        run: |
          mkdir -p releases/checks-0.6.18
          # Reuse successful checks from run 40437092864 on the identical compiled APK.
          for directory in video-check upgrade618-check english-check; do
            if test -d "$directory"; then mkdir -p "releases/checks-0.6.18/$directory"; cp -R "$directory/." "releases/checks-0.6.18/$directory/"; fi
          done
          rm -f releases/checks-0.6.18/video-check/fixture.pid releases/checks-0.6.18/video-check/*.mp4
          cp /tmp/video-fixture.log releases/checks-0.6.18/video-origin.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/checks-0.6.18
          git diff --cached --quiet || git commit -m 'test: preserve 0.6.18 native playback, download and upgrade evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
