name: Refresh metadata and deploy Zhigeng
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: zhigeng-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh source-backed metadata
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/zhi-geng/
        run: node scripts/refresh.mjs
      - name: Save refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh discovery feed [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
