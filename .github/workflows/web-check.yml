name: Check Zhigeng website v0.6.4

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/zhigeng-v064.js'
      - 'assets/kanju-bridge.js'
      - 'assets/sms-hub.js'
      - 'assets/node-directory.js'
      - 'assets/ai-memberships.js'
      - 'data/ai-memberships.json'
      - 'data/node-sites.json'
      - 'sms-hub/index.html'
      - 'assets/annual-rankings.js'
      - 'assets/zhigeng-v064.css'
      - 'assets/reader-experience.js'
      - 'data/domestic.json'
      - 'tests/web-v064.test.mjs'
      - 'tests/kanju-bridge.test.mjs'
      - 'tests/sms-hub.test.mjs'
      - 'tests/node-directory.test.mjs'
      - 'tests/ai-memberships.test.mjs'
      - 'tests/annual-rankings.test.mjs'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/zhigeng-v064.js'
      - 'assets/kanju-bridge.js'
      - 'assets/zhigeng-v064.css'
      - 'assets/reader-experience.js'
      - 'data/domestic.json'
      - 'tests/web-v064.test.mjs'
      - 'tests/kanju-bridge.test.mjs'

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check browser scripts and editorial UI
        run: |
          node --check assets/zhigeng-v064.js
          node --check assets/annual-rankings.js
          node --check assets/kanju-bridge.js
          node --check assets/sms-hub.js
          node --check assets/node-directory.js
          node --check assets/ai-memberships.js
          node --check assets/reader-experience.js
          node --test tests/web-v064.test.mjs tests/annual-rankings.test.mjs tests/kanju-bridge.test.mjs tests/sms-hub.test.mjs tests/node-directory.test.mjs tests/ai-memberships.test.mjs
