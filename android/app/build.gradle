plugins { id 'com.android.application' }
android {
    namespace 'cn.zhigeng.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.zhigeng.app'
        minSdk 26
        targetSdk 34
