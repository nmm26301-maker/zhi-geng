plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'cn.zhigeng.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'cn.zhigeng.app'
        manifestPlaceholders = [appLabel: '知更']
        multiDexEnabled true
        minSdk 26
        targetSdk 34
        versionCode 619
        versionName '0.6.19'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.all { systemProperty "zhigeng.assets", file("src/main/assets").absolutePath } }
    buildTypes {
        release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        debug { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    packaging { resources { excludes += ["META-INF/DEPENDENCIES"]; merges += ["META-INF/LICENSE*", "META-INF/NOTICE*"] } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation "junit:junit:4.13.2"; testImplementation "org.json:json:20240303" }

dependencies {
    implementation 'org.readium.kotlin-toolkit:readium-shared:3.1.0'
    implementation 'org.readium.kotlin-toolkit:readium-streamer:3.1.0'
    implementation 'org.readium.kotlin-toolkit:readium-navigator:3.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

dependencies { implementation 'org.jsoup:jsoup:1.18.3' }




dependencies {
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
}

dependencies { implementation "io.github.dokar3:quickjs-kt:1.0.15" }

configurations.matching { it.name.endsWith("UnitTestRuntimeClasspath") }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module("io.github.dokar3:quickjs-kt-android")).using(module("io.github.dokar3:quickjs-kt-jvm:1.0.15"))
    }
}

kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }
