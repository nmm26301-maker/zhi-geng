<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>安读 · Anx Reader</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #f7f3e9; }
  body { user-select: none; -webkit-user-select: none; }
  foliate-view { display: block; width: 100vw; height: 100vh; }
  #footnote-dialog { position: fixed; width: 80vw; height: 70vh; max-width: 420px; max-height: 360px; border-radius: 18px; border: 1px solid #d9d3c6; background: rgba(255,255,255,.96); z-index: 1000; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #footnote-dialog main { overflow: auto; width: 100%; height: 100%; }
</style>
<div id="footnote-dialog"><main></main></div>
<script>
  // Anx Reader's foliate-js bridge is reused inside 知更 without the Flutter shell.
  window.flutter_inappwebview = {
    callHandler: function (name, data) {
      try {
        if (window.Android && window.Android.onEvent) {
          window.Android.onEvent(name, JSON.stringify(data === undefined ? null : data));
        }
      } catch (_) {}
      return Promise.resolve(null);
    }
  };
  window.addEventListener('contextmenu', function (event) { event.preventDefault(); });
</script>
<script src="./dist/bundle.js"></script>
